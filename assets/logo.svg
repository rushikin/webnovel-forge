<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="forgeGemGrad" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="forgeGoldGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="forgeAnvilGrad" x1="8" y1="40" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Matrix Facet -->
  <path d="M32 4 L56 18 L56 46 L32 60 L8 46 L8 18 Z" stroke="url(#forgeGemGrad)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 2" opacity="0.4" />

  <!-- Lower Anvil Hearth -->
  <path d="M14 43 L22 36 L42 36 L50 43 L46 51 L18 51 Z" fill="url(#forgeAnvilGrad)" stroke="url(#forgeGemGrad)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Anvil Story Spine -->
  <path d="M22 36 L32 44 L42 36" stroke="url(#forgeGoldGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Radiant Quill Stylus -->
  <path d="M32 10 L38 24 L35 38 L32 44 L29 38 L26 24 Z" fill="url(#forgeGoldGrad)" stroke="#FFFBEB" stroke-width="1" stroke-linejoin="round" filter="url(#forgeGlow)" />

  <!-- Quill Ink Channel -->
  <path d="M32 16 L32 34" stroke="#78350F" stroke-width="1.25" stroke-linecap="round" />

  <!-- Constellation Nodes -->
  <circle cx="32" cy="10" r="2.5" fill="#FFFFFF" filter="url(#forgeGlow)" />
  <circle cx="18" cy="20" r="1.75" fill="#38BDF8" />
  <circle cx="46" cy="20" r="1.75" fill="#C084FC" />
  <circle cx="32" cy="44" r="1.75" fill="#FDE047" />

  <!-- Connecting Vector Beams -->
  <line x1="32" y1="10" x2="18" y2="20" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
  <line x1="32" y1="10" x2="46" y2="20" stroke="#C084FC" stroke-width="1" stroke-opacity="0.6" />
</svg>
